name: Build all

on:
  push:
    branches:
     - master
    paths:
     - 'deps/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - 'bbl/**'
     - 'resources/**'
     - ".github/workflows/build_*.yml"

  pull_request:
    branches:
     - master
    paths:
     - 'deps/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - ".github/workflows/build_*.yml"
     - 'BuildLinux.sh'
     - 'build_win.bat'
    
  workflow_dispatch: # manual dispatch
      inputs:
        build-deps-only:
            description: 'Only build dependencies (bypasses caching)'
            type: boolean
            default: false
        build-platforms:
            description: '选择构建平台'
            type: choice
            default: all
            options:
              - all
              - linux-macos
              - linux
              - macos

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', inputs.build-platforms) || '' }}
  cancel-in-progress: true

jobs:
  build_all:
    name: Build All
    if: github.event_name != 'workflow_dispatch' || inputs.build-platforms == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: ubuntu-24.04
          - os: ubuntu-26.04
          - os: windows-latest
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: macos-26
            arch: arm64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit

  build_linux:
    name: Linux 构建验证
    if: github.event_name == 'workflow_dispatch' && (inputs.build-platforms == 'linux-macos' || inputs.build-platforms == 'linux')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      build-deps-only: ${{ inputs.build-deps-only || false }}

  build_macos:
    name: macOS 构建验证
    if: github.event_name == 'workflow_dispatch' && (inputs.build-platforms == 'linux-macos' || inputs.build-platforms == 'macos')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only || false }}
