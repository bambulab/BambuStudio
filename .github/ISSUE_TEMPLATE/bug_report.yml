name: Bug or build problem
description: Report a reproducible problem with the fork.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Build and environment
      description: Commit, OS, compiler/toolset, build configuration, and plugin revision. Include printer model, firmware, and mode if relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact commands or a small sequence of UI actions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, printer access codes, serial numbers, and private network details.
      render: text
