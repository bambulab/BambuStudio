name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse fork helpers
        shell: pwsh
        run: |
          $files = @('build-fully-open.ps1', 'scripts/start-open-studio.ps1')
          foreach ($file in $files) {
            $parseErrors = $null
            $parseTokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$parseTokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "$file parsed successfully"
          }
  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin helper
        run: sh -n build-fully-open.sh
