    <path d="M 46.78,38 A 24,24 0 0 1 38,46.78"  stroke-opacity="0.48"/>
    <path d="M 38,46.78 A 24,24 0 0 1 26,50"     stroke-opacity="0.37"/>
    <path d="M 26,50    A 24,24 0 0 1 14,46.78"  stroke-opacity="0.25"/>
