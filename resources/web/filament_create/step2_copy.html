<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>创建自定义耗材 - 步骤2（复制预设）</title>
    <link rel="stylesheet" href="../guide/css/common.css" />
    <link rel="stylesheet" href="step1.css" />
    <link rel="stylesheet" href="step2_type.css" />
    <link rel="stylesheet" href="step2_copy.css" />
    <script src="../guide/js/jquery-3.6.0.min.js"></script>
    <script src="../guide/js/globalapi.js"></script>
    <script src="../data/text.js"></script>
    <script src="step2_copy.js"></script>
</head>
<body>
    <div class="window-frame">
<div class="page-wrapper">
            <header class="steps-container">
                <div class="step-item done">
                    <div class="step-circle"></div>
                    <div class="step-label trans" tid="t200">Basic Info</div>
                </div>
                <div class="step-line"></div>
                <div class="step-item active">
                    <div class="step-circle">2</div>
                    <div class="step-label trans" tid="t201">Set Parameters</div>
                </div>
                <div class="step-line"></div>
                <div class="step-item">
                    <div class="step-circle">3</div>
                    <div class="step-label trans" tid="t202">Complete</div>
                </div>
            </header>

            <main class="content-container">
                <section class="form-section copy-section">

                    <!-- 选择支持的打印机 -->
                    <div class="info-row">
                        <span class="info-label required trans" tid="t227">Select supported printers:</span>
                        <div class="input-wrapper select-arrow" style="width: 314px; height: 24px;">
                            <input type="text" id="input-printer" placeholder="Select supported printers" data-ph-tid="t228" readonly />

                            <!-- 打印机选择弹出下拉：锚定在 input 下方，不遮盖表格区 -->
                            <div id="printer-dropdown" class="printer-dropdown hidden">
                                <div class="selection-area">
                                    <div class="printer-list" id="printer-list"></div>
                                    <div class="nozzle-list" id="nozzle-list"></div>
                                </div>
                                <div class="dropdown-empty" id="dropdown-empty" style="display:none;">
                                    <div class="empty-state-text trans" tid="t270">No compatible printers</div>
                                </div>
                                <div class="dropdown-confirm-bar">
                                    <button id="btn-dropdown-confirm" class="btn-primary trans" tid="t229" style="height:28px; padding: 0 16px; font-size:12px;">Confirm</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 空态占位：选完打印机之前显示 -->
                    <div class="empty-state" id="empty-state">
                        <img class="empty-state-img" src="img/preset_empty.svg" alt="" />
                        <div class="empty-state-text trans" tid="t269">Please select supported printers</div>
                    </div>

                    <!-- 预设配置表（选完打印机确认后才显示） -->
                    <div id="preset-table-area" style="display:none; width:100%;">
                        <div class="preset-table-header trans" tid="t230">Set the reference preset for each printer preset</div>
                        <div class="preset-table" id="preset-table"></div>
                    </div>

                </section>
            </main>

            <footer class="footer-actions">
                <button id="btn-prev" class="btn-secondary trans" tid="t8">Back</button>
                <button id="btn-next" class="btn-primary trans" tid="t9" disabled>Next</button>
                <button id="btn-cancel" class="btn-secondary trans" tid="t38">Cancel</button>
            </footer>
        </div>
    </div>
</body>
</html>
