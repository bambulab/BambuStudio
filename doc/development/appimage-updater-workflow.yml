name: Linux in-app updater

on:
  push:
    branches: [feature/linux-in-app-updates]
    paths:
      - 'src/slic3r/Utils/AppImageUpdater.*'
      - 'src/slic3r/Utils/ReleaseUpdater.*'
      - 'src/slic3r/Utils/DesktopUpdater.*'
      - 'src/slic3r/GUI/AppUpdate.cpp'
      - 'tests/appimage_updater/**'
      - '.github/workflows/appimage-updater.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libcurl4-openssl-dev libssl-dev
      - name: Build and run updater tests
        run: |
          cmake -S tests/appimage_updater -B build/updater-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/updater-tests -j2
          ctest --test-dir build/updater-tests --output-on-failure

  appimage:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Install build dependencies
        run: |
          # BuildLinux.sh probes GTK before installing packages on a fresh runner.
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          sudo ./BuildLinux.sh -ur
      - name: Cache compiled dependencies
        id: deps
        uses: actions/cache@v5
        with:
          path: deps/build/destdir
          key: ubuntu-22.04-updater-deps-${{ hashFiles('deps/**') }}
      - name: Build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: ./BuildLinux.sh -dr
      - name: Build AppImage
        run: |
          ./BuildLinux.sh -sir
          cp build/BambuStudio_ubu64.AppImage build/BambuStudio_linux-x86_64.AppImage
          cd build
          sha256sum BambuStudio_linux-x86_64.AppImage > BambuStudio_linux-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: BambuStudio-linux-x86_64-in-app-updater
          path: |
            build/BambuStudio_linux-x86_64.AppImage
            build/BambuStudio_linux-x86_64.AppImage.sha256
          if-no-files-found: error
